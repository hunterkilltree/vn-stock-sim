# Runs the demo: Postgres + Go backend + Next.js frontend, both apps built
# from source. Accounts, portfolios, orders, watchlists, backtests and
# Replay sessions live in the "pgdata" volume, so they survive restarts
# (phase-persistence.md); `./run.sh down -v` wipes them.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vss
      POSTGRES_PASSWORD: vss-dev-password
      POSTGRES_DB: vss
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vss -d vss"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      JWT_SECRET: dev-secret-change-me
      # "vci" (default if unset) is the real, live market-data adapter
      # against Vietcap Securities' own trading-platform API -- see
      # phase-vci-market-data.md. Set to "mock" here for a fully
      # offline demo (e.g. no outbound network access).
      MARKET_DATA_SOURCE: vci
      # Unset = in-memory stores (data resets on restart).
      DATABASE_URL: postgres://vss:vss-dev-password@db:5432/vss?sslmode=disable
      # gemini-bridge's compose-network address is a private IP; this lets
      # Trợ lý Quant's "Máy chủ riêng" provider reach it in this demo (see
      # phase-quant-gemini-bridge.md). Leave unset on a shared/public host.
      QUANT_ALLOW_PRIVATE_ENDPOINTS: "true"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # backend:8080 is this compose network's internal DNS name for the
        # backend service -- not reachable as such from the host.
        NEXT_PUBLIC_API_BASE_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Reference "Máy chủ riêng" (self-hosted) provider for Trợ lý Quant: an
  # OpenAI-compatible bridge that forwards to Google Gemini using this
  # operator's own key -- see phase-quant-gemini-bridge.md. In Settings ->
  # Mô hình AI, pick "Máy chủ riêng" and set the endpoint to
  # http://gemini-bridge:8090/v1 (that's how the *backend* reaches it; the
  # browser never talks to it directly).
  gemini-bridge:
    build:
      context: ./services/quant-gemini-bridge
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8090:8090"

volumes:
  pgdata:
