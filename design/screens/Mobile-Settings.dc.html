<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cài đặt mô hình AI — điện thoại</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Lora:wght@600;700&amp;display=swap">
<style>
body { margin: 0; background: #0F0F0E; color: #F3F0E9; font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #E08A3C; text-decoration: none; }
a:hover { color: #F0A65C; }
button, input, select { font-family: inherit; }
input[type="range"] { accent-color: #E08A3C; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0F0F0E; overflow: hidden;">

  <div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 52px 18px 14px 18px; display: flex; flex-direction: column; gap: 14px;">

    <header style="display: flex; align-items: center; gap: 12px;">
      <a href="Mobile-Quant.dc.html" aria-label="Trở lại trợ lý Quant" style="width: 44px; height: 44px; flex-shrink: 0; border: 1px solid #2C2C28; border-radius: 12px; background: #171715; color: #A5A19A; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-family: Lora, Georgia, serif; font-size: 20px; font-weight: 700;">Mô hình AI</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8A867E;">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #35C77F;"></span>
          <span>Đã kết nối · 14:32</span>
        </span>
      </div>
    </header>

    <a href="Mobile-Settings.dc.html" style="box-sizing: border-box; padding: 13px 14px; border: 1px solid #4A3521; border-radius: 13px; background: #1C1813; color: #F3F0E9; display: flex; align-items: center; gap: 12px;">
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 10px; color: #E08A3C; letter-spacing: 0.08em; text-transform: uppercase;">Nhà cung cấp</span>
        <span style="font-size: 13.5px; font-weight: 600;">Claude · khoá của bạn</span>
        <span style="font-size: 11px; color: #8A867E;">Bạn trả phí trực tiếp cho nhà cung cấp</span>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A867E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </a>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label for="mkey" style="font-size: 12px; color: #A5A19A;">Khoá API</label>
      <div style="display: flex; gap: 8px;">
        <input id="mkey" type="password" value="sk-ant-••••••••4f2b" style="flex-grow: 1; min-width: 0; box-sizing: border-box; height: 48px; padding: 0 14px; border: 1px solid #2C2C28; border-radius: 12px; background: #1F1F1C; color: #F3F0E9; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; outline: none;">
        <button type="button" style="box-sizing: border-box; height: 48px; padding: 0 14px; border: 1px solid #3C3C36; border-radius: 12px; background: #2C2C28; color: #F3F0E9; font-size: 13px; font-weight: 600; cursor: pointer;">Kiểm tra</button>
      </div>
      <span style="display: flex; align-items: flex-start; gap: 7px; font-size: 11px; color: #8A867E; line-height: 1.45;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A867E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;" aria-hidden="true"><path d="M6 11V8a6 6 0 1112 0v3M5 11h14v9H5z"></path></svg>
        <span>Khoá mã hoá, chỉ lưu trên máy này.</span>
      </span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label for="mmodel" style="font-size: 12px; color: #A5A19A;">Mô hình</label>
      <select id="mmodel" style="box-sizing: border-box; height: 48px; padding: 0 12px; border: 1px solid #2C2C28; border-radius: 12px; background: #1F1F1C; color: #F3F0E9; font-size: 13px; outline: none;">
        <option>Bản mạnh nhất — suy luận sâu</option>
        <option>Bản cân bằng — nhanh hơn</option>
        <option>Bản nhẹ — lọc và tóm tắt</option>
      </select>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <label for="mtemp" style="font-size: 12.5px; color: #D7D2C7;">Mức sáng tạo</label>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #E08A3C;">0,2 · chặt chẽ</span>
      </div>
      <input id="mtemp" type="range" min="0" max="100" value="20" style="width: 100%; height: 6px; cursor: pointer;">
    </div>

    <section style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px;">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600;">Dữ liệu gửi cho mô hình</h2>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <sc-for list="{{scopes}}" as="s" hint-placeholder-count="4">
          <label style="display: flex; align-items: center; gap: 12px; box-sizing: border-box; min-height: 48px; padding: 6px 0; cursor: pointer;">
            <input type="checkbox" checked="{{s.checked}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
              <span style="{{s.labelStyle}}">{{s.label}}</span>
              <span style="font-size: 11px; color: #8A867E;">{{s.note}}</span>
            </span>
            <span style="{{s.track}}">
              <span style="{{s.knob}}"></span>
            </span>
          </label>
        </sc-for>
      </div>
    </section>

    <div style="box-sizing: border-box; padding: 13px 14px; border: 1px solid #23231F; border-radius: 13px; background: #171715; display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 12.5px; font-weight: 600;">Mức dùng tháng 9</span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11.5px; color: #A5A19A;">62.400 / 200.000</span>
      </div>
      <div style="height: 7px; border-radius: 4px; background: #23231F;">
        <div style="width: 31.2%; height: 7px; border-radius: 4px; background: #E08A3C;"></div>
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; box-sizing: border-box; padding: 12px 18px 22px 18px; border-top: 1px solid #2C2C28; background: #131311; display: flex; align-items: center; gap: 12px;">
    <span style="display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: #F0C243;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #F0C243;"></span>
      <span>3 thay đổi</span>
    </span>
    <button type="button" style="flex-grow: 1; box-sizing: border-box; height: 52px; border: 0; border-radius: 14px; background: #E08A3C; color: #131210; font-size: 15px; font-weight: 600; cursor: pointer;">Lưu thay đổi</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const scopeRaw = [
      ['Giá và khối lượng', 'Cần cho mọi câu hỏi về biểu đồ', true],
      ['Chỉ báo kỹ thuật', 'RSI, MACD, đường trung bình', true],
      ['Số dư và vị thế giấy', 'Để Quant gợi ý theo danh mục', false],
      ['Sổ giao dịch và ghi chú', 'Ghi chú cá nhân trong từng lệnh', false]
    ];
    return {
      scopes: scopeRaw.map(function (s) {
        return {
          label: s[0], note: s[1], checked: s[2],
          labelStyle: 'font-size: 13px; font-weight: 500; color: ' + (s[2] ? '#F3F0E9' : '#A5A19A') + ';',
          track: 'position: relative; width: 44px; height: 26px; flex-shrink: 0; border-radius: 13px; background: ' +
            (s[2] ? '#E08A3C' : '#2C2C28') + ';',
          knob: 'position: absolute; top: 3px; left: ' + (s[2] ? '21px' : '3px') +
            '; width: 20px; height: 20px; border-radius: 50%; background: ' + (s[2] ? '#131210' : '#8A867E') + ';'
        };
      })
    };
  }
}
</script>
</body>
</html>
