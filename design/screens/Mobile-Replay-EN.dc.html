<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Replay Mode — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Lora:wght@600;700&amp;display=swap">
<style>
body { margin: 0; background: #0F0F0E; color: #F3F0E9; font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #E08A3C; text-decoration: none; }
a:hover { color: #F0A65C; }
button { font-family: inherit; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #0F0F0E; overflow: hidden;">

  <div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 52px 18px 14px 18px; display: flex; flex-direction: column; gap: 13px;">

    <header style="display: flex; align-items: center; gap: 12px;">
      <a href="Mobile-Market-EN.dc.html" aria-label="Quit the Replay session" style="width: 44px; height: 44px; flex-shrink: 0; border: 1px solid #2C2C28; border-radius: 12px; background: #171715; color: #A5A19A; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
        <span style="font-family: Lora, Georgia, serif; font-size: 19px; font-weight: 700;">Replay · HPG</span>
        <span style="font-size: 11px; color: #8A867E;">Daily candles · simulating from 04/01/2021</span>
      </div>
      <span style="flex-shrink: 0; padding: 7px 11px; border: 1px solid #4A3521; border-radius: 10px; background: #1C1813; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; color: #E08A3C;">44/120</span>
    </header>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; color: #8A867E;">
        <span>04/01/2021</span>
        <span style="color: #D7D2C7;">05/03/2021</span>
        <span>30/06/2021</span>
      </div>
      <div style="position: relative; height: 6px; border-radius: 3px; background: #23231F;">
        <div style="position: absolute; left: 0; top: 0; width: 36.7%; height: 6px; border-radius: 3px; background: #E08A3C;"></div>
        <div style="position: absolute; left: 36.7%; top: -4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #F3F0E9;"></div>
      </div>
    </div>

    <section style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 12px; border: 1px solid #2C2C28; border-radius: 14px; background: #171715; display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 9px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10.5px; color: #A5A19A;">
          <span style="color: #D7D2C7;">05/03</span>
          <span>O 45.10</span>
          <span style="color: #35C77F;">C 46.20</span>
        </div>
        <span style="display: flex; align-items: center; gap: 5px; font-size: 10px; color: #8A867E;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8A867E" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 3l18 18M10.6 5.3A9 9 0 0121 12c-.6 1.3-1.5 2.5-2.6 3.5M6.2 6.2A15 15 0 003 12c1.8 3.7 5.2 6 9 6 1.3 0 2.5-.3 3.7-.8"></path></svg>
          <span>future hidden</span>
        </span>
      </div>

      <svg viewBox="0 0 354 250" width="100%" height="250" fill="none" role="img" aria-label="Replay chart: 44 candles revealed, the rest of the history masked, with buy and sell markers">
        <sc-for list="{{grid}}" as="g" hint-placeholder-count="4">
          <g>
            <line x1="0" y1="{{g.y}}" x2="308" y2="{{g.y}}" stroke="#23231F" stroke-width="1"></line>
            <text x="354" y="{{g.ty}}" text-anchor="end" fill="#8A867E" font-family="'IBM Plex Mono', monospace" font-size="9.5">{{g.label}}</text>
          </g>
        </sc-for>
        <rect x="{{maskX}}" y="0" width="{{maskW}}" height="196" fill="#121210"></rect>
        <line x1="{{maskX}}" y1="0" x2="{{maskX}}" y2="196" stroke="#4A3521" stroke-width="1.3" stroke-dasharray="4 4"></line>
        <text x="{{maskTextX}}" y="100" text-anchor="middle" fill="#57534A" font-family="'Be Vietnam Pro', sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.1em">HIDDEN</text>
        <sc-for list="{{candles}}" as="c" hint-placeholder-count="44">
          <g>
            <path d="{{c.wick}}" stroke="{{c.col}}" stroke-width="1"></path>
            <rect x="{{c.x}}" y="{{c.y}}" width="{{c.w}}" height="{{c.h}}" fill="{{c.col}}" rx="0.6"></rect>
          </g>
        </sc-for>
        <polyline points="{{sma20}}" stroke="#E08A3C" stroke-width="1.4" stroke-linejoin="round"></polyline>
        <sc-for list="{{marks}}" as="m" hint-placeholder-count="3">
          <path d="{{m.tri}}" fill="{{m.col}}"></path>
        </sc-for>
        <line x1="0" y1="{{stopY}}" x2="{{maskX}}" y2="{{stopY}}" stroke="#FF5C5C" stroke-width="1" stroke-dasharray="3 3"></line>
        <g>
          <sc-for list="{{vol}}" as="v" hint-placeholder-count="44">
            <rect x="{{v.x}}" y="{{v.y}}" width="{{v.w}}" height="{{v.h}}" fill="{{v.col}}" opacity="0.6" rx="0.6"></rect>
          </sc-for>
        </g>
      </svg>

      <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 9px; border-top: 1px solid #23231F;">
        <span style="font-size: 11.5px; color: #8A867E;">Holding</span>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12.5px; font-weight: 600;">1,000 HPG @ 44.80</span>
      </div>
    </section>

    <div style="display: flex; align-items: center; gap: 9px;">
      <button type="button" aria-label="Step back one candle" style="width: 52px; height: 52px; flex-shrink: 0; border: 1px solid #2C2C28; border-radius: 14px; background: #171715; color: #A5A19A; cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-7 6 7 6V6z"></path><path d="M6 5v14"></path></svg>
      </button>
      <button type="button" style="flex-grow: 1; box-sizing: border-box; height: 52px; border: 0; border-radius: 14px; background: #2C2C28; color: #F3F0E9; font-size: 14.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l7 6-7 6V6z"></path><path d="M18 5v14"></path></svg>
        <span>Next candle</span>
      </button>
      <button type="button" aria-label="Play automatically" style="width: 52px; height: 52px; flex-shrink: 0; border: 0; border-radius: 14px; background: #E08A3C; color: #131210; cursor: pointer; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l12 7-12 7V5z"></path></svg>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div style="box-sizing: border-box; padding: 9px 10px; border: 1px solid #23231F; border-radius: 11px; background: #171715; display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 9.5px; color: #8A867E;">{{s.k}}</span>
          <span style="{{s.style}}">{{s.v}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex-shrink: 0; box-sizing: border-box; padding: 12px 18px 22px 18px; border-top: 1px solid #2C2C28; background: #131311; display: flex; align-items: center; gap: 10px;">
    <button type="button" style="flex-grow: 1; box-sizing: border-box; height: 52px; border: 0; border-radius: 14px; background: #35C77F; color: #08130D; font-size: 15px; font-weight: 600; cursor: pointer;">Buy at 46.20</button>
    <button type="button" style="flex-grow: 1; box-sizing: border-box; height: 52px; border: 0; border-radius: 14px; background: #FF5C5C; color: #1A0808; font-size: 15px; font-weight: 600; cursor: pointer;">Sell at 46.20</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  rng(seed) {
    let s = seed;
    return function () { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
  }
  num(v, d) {
    return v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  bars(n, seed, vol, endPrice) {
    const r = this.rng(seed);
    const out = [];
    let px = 100;
    for (let i = 0; i < n; i++) {
      const o = px;
      const c = o * (1 + (r() - 0.43) * vol / 100);
      const h = Math.max(o, c) * (1 + r() * vol / 300);
      const l = Math.min(o, c) * (1 - r() * vol / 300);
      out.push({ o: o, h: h, l: l, c: c, v: 0.4 + r() * 1.6 });
      px = c;
    }
    const k = endPrice / out[n - 1].c;
    return out.map(function (d) { return { o: d.o * k, h: d.h * k, l: d.l * k, c: d.c * k, v: d.v }; });
  }
  sma(arr, p) {
    return arr.map(function (v, i) {
      if (i < p - 1) return null;
      let s = 0;
      for (let j = i - p + 1; j <= i; j++) s += arr[j];
      return s / p;
    });
  }
  renderVals() {
    const self = this;
    const shown = 44, plotW = 308;
    const step = plotW / 120 * 1.9, bw = step * 0.58;
    const x = function (i) { return i * step + step / 2; };
    const data = this.bars(shown, 51977, 2.6, 46.2);
    const closes = data.map(function (d) { return d.c; });

    const hi = Math.max.apply(null, data.map(function (d) { return d.h; })) * 1.02;
    const lo = Math.min.apply(null, data.map(function (d) { return d.l; })) * 0.97;
    const H = 196, pad = 10;
    const py = function (v) { return pad + (hi - v) / (hi - lo) * (H - pad * 2); };

    const candles = data.map(function (d, i) {
      const col = d.c >= d.o ? '#35C77F' : '#FF5C5C';
      const top = py(Math.max(d.o, d.c));
      const bot = py(Math.min(d.o, d.c));
      const cx = x(i);
      return {
        col: col,
        wick: 'M' + cx.toFixed(1) + ' ' + py(d.h).toFixed(1) + 'V' + py(d.l).toFixed(1),
        x: (cx - bw / 2).toFixed(1),
        y: top.toFixed(1),
        w: bw.toFixed(1),
        h: Math.max(1.3, bot - top).toFixed(1)
      };
    });

    const grid = [];
    for (let i = 0; i <= 3; i++) {
      const v = lo + (hi - lo) * i / 3;
      const gy = py(v);
      grid.push({ y: gy.toFixed(1), ty: (gy + 3.2).toFixed(1), label: self.num(v, 1) });
    }

    const maxV = Math.max.apply(null, data.map(function (d) { return d.v; }));
    const vol = data.map(function (d, i) {
      const h = d.v / maxV * 34;
      return {
        x: (x(i) - bw / 2).toFixed(1),
        y: (248 - h).toFixed(1),
        w: bw.toFixed(1),
        h: Math.max(1.2, h).toFixed(1),
        col: d.c >= d.o ? '#35C77F' : '#FF5C5C'
      };
    });

    const maskX = x(shown - 1) + step / 2;
    const tri = function (i, price, up, col) {
      const cx = x(i);
      const cy = py(price) + (up ? 12 : -12);
      const s = 5;
      return {
        col: col,
        tri: up
          ? 'M' + cx + ' ' + (cy - s) + 'L' + (cx - s) + ' ' + (cy + s) + 'L' + (cx + s) + ' ' + (cy + s) + 'Z'
          : 'M' + cx + ' ' + (cy + s) + 'L' + (cx - s) + ' ' + (cy - s) + 'L' + (cx + s) + ' ' + (cy - s) + 'Z'
      };
    };
    const marks = [
      tri(17, data[17].l, true, '#35C77F'),
      tri(29, data[29].h, false, '#FF5C5C'),
      tri(38, data[38].l, true, '#35C77F')
    ];

    const statRaw = [['NAV', '108.7M', '#F3F0E9'], ['P/L', '+8.74%', '#35C77F'], ['Trades', '3', '#F3F0E9'], ['Score', '74', '#E08A3C']];
    const stats = statRaw.map(function (s) {
      return {
        k: s[0], v: s[1],
        style: 'font-family: \'IBM Plex Mono\', ui-monospace, monospace; font-size: 12.5px; font-weight: 600; color: ' + s[2] + ';'
      };
    });

    const smaVals = this.sma(closes, 20);
    const smaPts = [];
    for (let i = 0; i < smaVals.length; i++) if (smaVals[i] !== null) smaPts.push(x(i).toFixed(1) + ',' + py(smaVals[i]).toFixed(1));

    return {
      candles: candles, grid: grid, vol: vol, marks: marks, stats: stats,
      sma20: smaPts.join(' '),
      maskX: maskX.toFixed(1),
      maskW: (plotW - maskX).toFixed(1),
      maskTextX: (maskX + (plotW - maskX) / 2).toFixed(1),
      stopY: py(43.5).toFixed(1)
    };
  }
}
</script>
</body>
</html>
