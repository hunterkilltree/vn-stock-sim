<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng nhập — điện thoại</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Lora:wght@600;700&amp;display=swap">
<style>
body { margin: 0; background: #0F0F0E; color: #F3F0E9; font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: #E08A3C; text-decoration: none; }
a:hover { color: #F0A65C; }
button, input { font-family: inherit; }
input[type="checkbox"] { accent-color: #E08A3C; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 22px 28px 22px; background: #0F0F0E; display: flex; flex-direction: column; gap: 22px; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 11px;">
    <span style="width: 38px; height: 38px; flex-shrink: 0; border-radius: 11px; background: #E08A3C; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="9" width="6" height="6" fill="#131210"></rect><rect x="14" y="9" width="6" height="8" fill="#131210"></rect><path d="M7 4v5M7 15v5M17 3v6M17 17v4" stroke="#131210" stroke-width="2.2" stroke-linecap="round"></path></svg>
    </span>
    <span style="display: flex; flex-direction: column; gap: 1px;">
      <span style="font-family: Lora, Georgia, serif; font-size: 18px; font-weight: 700;">VN Stock Sim</span>
      <span style="font-size: 10px; color: #8A867E; letter-spacing: 0.1em; text-transform: uppercase;">Mô phỏng · HOSE · Crypto</span>
    </span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 7px;">
    <h1 style="margin: 0; font-family: Lora, Georgia, serif; font-size: 27px; font-weight: 700; letter-spacing: -0.015em;">Đăng nhập</h1>
    <p style="margin: 0; font-size: 13px; color: #8A867E; line-height: 1.55; text-wrap: pretty;">Danh mục giấy và điểm Replay của bạn được lưu theo tài khoản.</p>
  </div>

  <form style="display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 7px;">
      <label for="email" style="font-size: 12.5px; color: #A5A19A;">Email</label>
      <input id="email" type="email" placeholder="ban@email.com" style="box-sizing: border-box; height: 52px; padding: 0 14px; border: 1px solid #2C2C28; border-radius: 13px; background: #171715; color: #F3F0E9; font-size: 14.5px; outline: none;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <label for="pw" style="font-size: 12.5px; color: #A5A19A;">Mật khẩu</label>
      <div style="display: flex; align-items: center; gap: 8px; box-sizing: border-box; height: 52px; padding: 0 8px 0 14px; border: 1px solid #2C2C28; border-radius: 13px; background: #171715;">
        <input id="pw" type="password" value="••••••••" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; color: #F3F0E9; font-size: 14.5px; outline: none;">
        <button type="button" style="box-sizing: border-box; height: 36px; padding: 0 12px; border: 0; border-radius: 9px; background: #23231F; color: #A5A19A; font-size: 12.5px; cursor: pointer;">Hiện</button>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px;">
      <label style="display: flex; align-items: center; gap: 9px; font-size: 13px; color: #A5A19A; cursor: pointer;">
        <input type="checkbox" checked="{{true}}" style="width: 17px; height: 17px;">
        <span>Ghi nhớ</span>
      </label>
      <a href="Mobile-Login.dc.html" style="font-size: 13px; font-weight: 500;">Quên mật khẩu?</a>
    </div>

    <button type="submit" style="box-sizing: border-box; height: 54px; border: 0; border-radius: 14px; background: #E08A3C; color: #131210; font-size: 15.5px; font-weight: 600; cursor: pointer;">Đăng nhập</button>
  </form>

  <div style="display: flex; align-items: center; gap: 14px;">
    <span style="flex-grow: 1; height: 1px; background: #23231F;"></span>
    <span style="font-size: 12px; color: #6F6C63;">hoặc</span>
    <span style="flex-grow: 1; height: 1px; background: #23231F;"></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <a href="Mobile-Market.dc.html" style="box-sizing: border-box; height: 54px; border: 1px solid #2C2C28; border-radius: 14px; background: #171715; color: #F3F0E9; font-size: 14.5px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 9px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 6L4 12l7 6V6zM20 6l-7 6 7 6V6z"></path></svg>
      <span>Dùng thử không cần tài khoản</span>
    </a>
    <p style="margin: 0; font-size: 12px; color: #8A867E; line-height: 1.5; text-wrap: pretty;">Chế độ khách chạy được Replay và biểu đồ ngay. Ứng dụng sẽ mời đăng nhập khi bạn đặt lệnh giấy đầu tiên.</p>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; justify-content: center; gap: 7px; padding-top: 16px; border-top: 1px solid #23231F; font-size: 13.5px; color: #8A867E;">
    <span>Chưa có tài khoản?</span>
    <a href="Signup.dc.html" style="font-weight: 600;">Đăng ký</a>
  </div>
</div>
</x-dc>

</body>
</html>
