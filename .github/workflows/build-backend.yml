# Manual build of the Go backend (backend/). Run from Actions -> "Build backend".
name: Build backend

on:
  workflow_dispatch:
    inputs:
      docker:
        description: Also build the backend Docker image
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Docker image
        if: ${{ inputs.docker }}
        run: docker build -t vn-stock-sim-backend .
