# Manual build of the Go backend (backend/). Run from Actions -> "Build backend".
name: Build backend

on:
  workflow_dispatch:
    inputs:
      push:
        description: Build and push the image to Docker Hub (testfeaturedev/vn-stock-sim-be)
        type: boolean
        default: true
      tag:
        description: Image tag (also pushes latest)
        type: string
        default: latest

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        if: ${{ inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            testfeaturedev/vn-stock-sim-be:${{ inputs.tag }}
            testfeaturedev/vn-stock-sim-be:latest
            testfeaturedev/vn-stock-sim-be:${{ github.sha }}
