# Manual build of the Python Gemini bridge (services/quant-gemini-bridge/).
# Run from Actions -> "Build quant-gemini-bridge".
name: Build quant-gemini-bridge

on:
  workflow_dispatch:
    inputs:
      push:
        description: Build and push the image to Docker Hub (testfeaturedev/vn-stock-sim-ai)
        type: boolean
        default: true
      tag:
        description: Image tag (also pushes latest)
        type: string
        default: latest

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/quant-gemini-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/quant-gemini-bridge/requirements.txt
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile main.py
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        if: ${{ inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: services/quant-gemini-bridge
          push: true
          tags: |
            testfeaturedev/vn-stock-sim-ai:${{ inputs.tag }}
            testfeaturedev/vn-stock-sim-ai:latest
            testfeaturedev/vn-stock-sim-ai:${{ github.sha }}
