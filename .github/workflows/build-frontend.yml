# Manual build of the Next.js frontend (frontend/). Run from Actions -> "Build frontend".
name: Build frontend

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: NEXT_PUBLIC_API_BASE_URL baked into the build
        type: string
        default: http://localhost:8080
      push:
        description: Build and push the image to Docker Hub (testfeaturedev/vn-stock-sim-fe)
        type: boolean
        default: true
      tag:
        description: Image tag (also pushes latest)
        type: string
        default: latest

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        if: ${{ inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ inputs.api_base_url }}
          tags: |
            testfeaturedev/vn-stock-sim-fe:${{ inputs.tag }}
            testfeaturedev/vn-stock-sim-fe:latest
            testfeaturedev/vn-stock-sim-fe:${{ github.sha }}
