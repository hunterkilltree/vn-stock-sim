# Manual build of the Next.js frontend (frontend/). Run from Actions -> "Build frontend".
name: Build frontend

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: NEXT_PUBLIC_API_BASE_URL baked into the build
        type: string
        default: http://localhost:8080
      docker:
        description: Also build the frontend Docker image
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build
      - name: Docker image
        if: ${{ inputs.docker }}
        run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" -t vn-stock-sim-frontend .
